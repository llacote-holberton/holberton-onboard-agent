name: ${COMPOSE_PROJECT_NAME}

services:
  # LLM CONFIGURATION -- AGNOSTIQUE (2026-08-21, Laurent) -- see
  # agent/planner.py's module docstring and .env.example: LLM_MODEL_NAME
  # (format "<provider>/<model>", via LiteLLM) now defaults to
  # "anthropic/claude-sonnet-4-6" (remote Claude API), the local Ollama
  # model being too unreliable at structured tool-calling in practice
  # (see planner.py's docstring history). Ollama is kept fully working
  # for whoever wants to run offline / without an API key (set
  # LLM_MODEL_NAME=ollama_chat/<tag> -- NOT "ollama/<tag>", see
  # planner.py's docstring section OLLAMA for why), but is no longer
  # started by default -- it now sits behind the "local-llm" Compose
  # profile, so `docker compose up` alone does NOT pull/start this
  # (heavy) container anymore. Recommended: use ./start.sh, which
  # detects an "ollama_chat/..." (or "ollama/...") LLM_MODEL_NAME and
  # handles the profile + model pull automatically --
  # see README.md "LLM Provider: any provider, any model" for the manual
  # steps if you'd rather not use it.
  ollama:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME}-ollama
    profiles: ["local-llm"]
    ports:
      - "${OLLAMA_PORT:-11434}:${OLLAMA_PORT:-11434}"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Fake SMTP server + web UI. Used by mcp-server's "mailbox" tool to send
  # onboarding emails without touching a real mail provider -- open the web
  # UI (MAILHOG_WEB_PORT) to see what was actually sent, no real inbox needed.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ${COMPOSE_PROJECT_NAME}-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP -- what mcp-server connects to
      - "${MAILHOG_WEB_PORT:-8025}:8025"   # web UI -- to visually check sent emails
    restart: unless-stopped

  # Service providing curated access to filesystem/db/APIs for the agent
  mcp-server:
    build:
      context: ${PWD}/mcp_server
      dockerfile: Dockerfile          # casse corrigée (était "DockerFile") — vérifie le nom réel du fichier sur le disque
    container_name: ${COMPOSE_PROJECT_NAME}-mcp-server
    ports:
      # Warning: right side port must match port(s) exposed in Dockerfile
      - "${HBN_MCP_PORT:-8200}:${HBN_MCP_PORT:-8200}"
    environment:
      - HBN_MCP_PORT=${HBN_MCP_PORT:-8200}
      - DATA_DIR=${DATA_DIR:-/app/data}
      # Liste des tools autorisés pour l'agent LLM, séparés par des
      # virgules. Vide/absent = tous les tools enregistrés sont autorisés.
      - ALLOWED_TOOLS=${ALLOWED_TOOLS:-}
      # Mailbox tool target -- see the mailhog service above.
      - MAILHOG_HOST=mailhog
      - MAILHOG_SMTP_PORT=${MAILHOG_SMTP_PORT:-1025}
      # Variables required for Github Issues API connection.
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
    volumes:
      # Added because will need access to write PDF and ics files
      - ${DATA_HOST_DIR:-./data}:${DATA_DIR:-/app/data}
    depends_on:
      - mailhog
    restart: unless-stopped

  # Agent in two steps:
  #   1. Planification: initiates prompts, get tools scheme
  #      from MCP server (list_tools, read only), calls Ollama.
  #   2. Execution: backend sens list of approved actions
  #      (and filtered by idempotence aka did they already were done);
  #      agent runs them one by one via call_tool() on MCP server. Dispatch
  #      Only automatic dispatch no new LLM call here and agent cannot decide
  #      which actions it makes
  # NOTE: "cancel" actions DO NOT go through agent but managed directly
  #   by MCP server from backend trigger (as they are decided by human).
  agent:
    build: ${PWD}/agent
    container_name: ${COMPOSE_PROJECT_NAME}-agent
    ports:
      - "${AGENT_PORT:-8100}:${AGENT_PORT:-8100}"
    # NOTE (2026-08-21) : plus de dépendance dure sur "ollama" -- ce
    # service ne démarre plus par défaut (voir son "profiles" ci-dessus),
    # et un depends_on vers un service dont le profil n'est pas actif
    # ferait échouer `docker compose up`. Si vous utilisez LLM_MODEL_NAME=
    # ollama_chat/... (ou ollama/...), démarrez ollama vous-même (--profile local-llm, ou
    # utilisez ./start.sh qui le fait pour vous) AVANT ou en même temps
    # que le reste -- voir README.md.
    depends_on:
      - mcp-server
    environment:
      # Sélection du modèle -- AGNOSTIQUE, voir .env.example et
      # agent/planner.py (module docstring) pour le détail : un seul
      # identifiant "<provider>/<model>" (LiteLLM) suffit à changer de
      # fournisseur, plus besoin d'une variable par fournisseur.
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-anthropic/claude-sonnet-4-6}
      - LLM_MODEL_API_KEY=${LLM_MODEL_API_KEY:-}
      # Uniquement utilisées quand LLM_MODEL_NAME commence par
      # "ollama_chat/" ou "ollama/" -- inoffensives sinon (le service
      # ollama n'est même pas démarré par défaut).
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_API_BASE=http://${OLLAMA_HOST:-ollama}:${OLLAMA_PORT:-11434}
      - MCP_SERVER_URL=http://mcp-server:${HBN_MCP_PORT:-8200}
      # Timeout (seconds) for a SINGLE agent -> LLM call, quel que soit
      # le fournisseur actif (LLM_MODEL_NAME ci-dessus) -- innermost
      # layer of the coordinated timeout chain, see .env.example and
      # agent/planner.py::_LLM_CALL_TIMEOUT. backend and frontend read
      # this SAME variable below and each add their own margin in code.
      - LLM_CALL_TIMEOUT_SECONDS=${LLM_CALL_TIMEOUT_SECONDS:-110}
      # Used to tell Python to not output Warning level (only) messages
      # Useful if using Google ADK because we won't configure
      #  "Google Application Default Credentials" so warns it fallbacks on "local".
      - PYTHONWARNINGS=ignore
      - PYTHONUNBUFFERED=1
    # No volume because Agent should not access anything directly, only MCP server
    #   writes things.

  # The backbone serving all requests from front-end and redirecting.
  backend:
    build:
      context: ${PWD}/backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      # DATA_DIR was missing and must be to ensure all app components
      #   target the same directory.
      - DATA_DIR=${DATA_DIR:-/app/data}
      - AGENT_AI_URL=http://agent:${AGENT_PORT:-8100}
      - MCP_SERVER_URL=http://mcp-server:${HBN_MCP_PORT:-8200}
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
      # Same variable as the agent service above -- backend derives its
      # own /plan timeout from it (+15s margin, see app/config.py).
      - LLM_CALL_TIMEOUT_SECONDS=${LLM_CALL_TIMEOUT_SECONDS:-110}
    volumes:
      - ${DATA_HOST_DIR:-./data}:${DATA_DIR:-/app/data}
    depends_on:
      - agent
      - mcp-server
      # Uncomment if/when agent and mcp-server expose their own /health
      #   to make health check, otherwise Compose can never know if healthy thus
      #   would never start
      # agent:
      #   condition: service_healthy
      # mcp-server:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Interface Streamlit. Only sees backend, in HTTP/JSON — NEVER
  # any direct call to agent / mcp-server / ollama / ./data volume.
  frontend:
    build:
      context: ${PWD}/frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    ports:
      - "${FRONTEND_PORT:-8501}:${FRONTEND_PORT:-8501}"
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-8501}
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8000}
      # Same variable as agent/backend above -- frontend derives its own
      # "Générer le plan" request timeout from it (+30s margin, see
      # frontend/app.py::_PLAN_GENERATION_TIMEOUT).
      - LLM_CALL_TIMEOUT_SECONDS=${LLM_CALL_TIMEOUT_SECONDS:-110}
    depends_on:
      - backend
      # Idem que pour backend plus haut : enable once
      # we could confirm healthcheck for backend is reliable.
      # backend:
      #   condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
