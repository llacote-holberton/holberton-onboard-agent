name: ${COMPOSE_PROJECT_NAME}

services:
  # Local LLM handler, for now only option to use application so always started
  ollama:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME}-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:${OLLAMA_PORT:-11434}"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Service providing curated access to filesystem/db/APIs for the agent
  mcp-server:
    build:
      context: ${PWD}/mcp_server
      dockerfile: Dockerfile          # casse corrigée (était "DockerFile") — vérifie le nom réel du fichier sur le disque
    container_name: ${COMPOSE_PROJECT_NAME}-mcp-server
    ports:
      # Warning: right side port must match port(s) exposed in Dockerfile
      - "${HBN_MCP_PORT:-8200}:${HBN_MCP_PORT:-8200}"
    environment:
      - HBN_MCP_PORT=${HBN_MCP_PORT:-8200}
      - DATA_DIR=${DATA_DIR:-/app/data}
    volumes:
      # Added because will need access to write PDF and ics files
      - ${DATA_HOST_DIR:-./data}:${DATA_DIR:-/app/data}
    restart: unless-stopped

  # Agent in two steps:
  #   1. Planification: initiates prompts, get tools scheme
  #      from MCP server (list_tools, read only), calls Ollama.
  #   2. Execution: backend sens list of approved actions
  #      (and filtered by idempotence aka did they already were done);
  #      agent runs them one by one via call_tool() on MCP server. Dispatch
  #      Only automatic dispatch no new LLM call here and agent cannot decide
  #      which actions it makes
  # NOTE: "cancel" actions DO NOT go through agent but managed directly
  #   by MCP server from backend trigger (as they are decided by human).
  agent:
    build: ${PWD}/agent
    container_name: ${COMPOSE_PROJECT_NAME}-agent
    ports:
      - "${AGENT_PORT:-8100}:${AGENT_PORT:-8100}"
    depends_on:
      - ollama
      - mcp-server
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_API_BASE=http://${OLLAMA_HOST:-ollama}:${OLLAMA_PORT:-11434}
      - OLLAMA_MODEL=qwen3:8b
      - MCP_SERVER_URL=http://mcp-server:${HBN_MCP_PORT:-8200}
      # Used to tell Python to not output Warning level (only) messages
      # Useful if using Google ADK because we won't configure
      #  "Google Application Default Credentials" so warns it fallbacks on "local".
      - PYTHONWARNINGS=ignore
      - PYTHONUNBUFFERED=1
    # No volume because Agent should not access anything directly, only MCP server
    #   writes things.

  # The backbone serving all requests from front-end and redirecting.
  backend:
    build:
      context: ${PWD}/backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - DATABASE_URL=sqlite:///${DATA_DIR:-/app/data}/onboarding.db
      - AGENT_AI_URL=http://agent:${AGENT_PORT:-8100}
      - MCP_SERVER_URL=http://mcp-server:${HBN_MCP_PORT:-8200}
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    volumes:
      - ${DATA_HOST_DIR:-./data}:${DATA_DIR:-/app/data}
    depends_on:
      - agent
      - mcp-server
      # Uncomment if/when agent and mcp-server expose their own /health
      #   to make health check, otherwise Compose can never know if healthy thus
      #   would never start
      # agent:
      #   condition: service_healthy
      # mcp-server:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama_data:
