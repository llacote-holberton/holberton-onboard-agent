<svg width="1580" height="950" viewBox="0 0 1580 950" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a463c"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a8578"/>
    </marker>
    <marker id="arrowDotted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b6656"/>
    </marker>
  </defs>

  <rect width="1580" height="950" fill="#ffffff"/>

  <text x="790" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#2c2a24">Architecture — Agent d'onboarding (LLM local + MCP, frontend / backend séparés)</text>

  <!-- Browser -->
  <rect x="170" y="60" width="260" height="70" rx="12" fill="#F2EFE6" stroke="#8A8578" stroke-width="2"/>
  <text x="300" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3630">Poste du manager</text>
  <text x="300" y="107" text-anchor="middle" font-size="12" fill="#5f594c">navigateur web</text>

  <!-- Docker compose boundary -->
  <rect x="110" y="170" width="1130" height="540" rx="16" fill="none" stroke="#4a86c8" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="130" y="196" font-size="13" font-weight="700" fill="#2c5d94">docker-compose.yml</text>

  <!-- Frontend -->
  <rect x="150" y="210" width="300" height="140" rx="12" fill="#F2EFE6" stroke="#8A8578" stroke-width="2"/>
  <text x="300" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3630">Frontend — Streamlit</text>
  <text x="300" y="256" text-anchor="middle" font-size="12" fill="#5f594c">container :8501</text>
  <text x="300" y="278" text-anchor="middle" font-size="12" fill="#5f594c">Prompt de chat</text>
  <text x="300" y="296" text-anchor="middle" font-size="12" fill="#5f594c">Liste d'actions à cocher</text>
  <text x="300" y="314" text-anchor="middle" font-size="12" fill="#5f594c">Bouton Exécuter / Annuler</text>
  <text x="300" y="332" text-anchor="middle" font-size="12" fill="#5f594c">Journal d'audit</text>

  <!-- Backend -->
  <rect x="520" y="210" width="425" height="130" rx="12" fill="#F2EFE6" stroke="#8A8578" stroke-width="2"/>
  <text x="732" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#3a3630">Backend — FastAPI (container :8000)</text>
  <text x="732" y="254" text-anchor="middle" font-size="11.5" fill="#5f594c">API REST + SQLAlchemy (Plan, Action, Employee, AuditLog)</text>
  <text x="732" y="272" text-anchor="middle" font-size="11.5" fill="#5f594c">délègue la génération du plan → Agent AI</text>
  <text x="732" y="290" text-anchor="middle" font-size="11.5" fill="#5f594c">délègue l'exécution / l'annulation des tools → MCP server</text>
  <text x="732" y="308" text-anchor="middle" font-size="11.5" fill="#5f594c">vérifie l'idempotence et écrit l'audit avant/après chaque appel</text>

  <!-- Agent AI -->
  <rect x="520" y="380" width="200" height="140" rx="10" fill="#E7E4FB" stroke="#5B4FC7" stroke-width="2"/>
  <text x="620" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#2f2680">Agent AI</text>
  <text x="620" y="424" text-anchor="middle" font-size="11" fill="#453aa8">container :8100</text>
  <text x="620" y="444" text-anchor="middle" font-size="11" fill="#453aa8">Construit le prompt système</text>
  <text x="620" y="461" text-anchor="middle" font-size="11" fill="#453aa8">+ appelle Ollama (Qwen3)</text>
  <text x="620" y="478" text-anchor="middle" font-size="11" fill="#453aa8">Client MCP : list_tools()</text>
  <text x="620" y="495" text-anchor="middle" font-size="11" fill="#453aa8">Propose un plan, n'exécute rien</text>

  <!-- MCP server -->
  <rect x="745" y="380" width="200" height="140" rx="10" fill="#E7E4FB" stroke="#5B4FC7" stroke-width="2"/>
  <text x="845" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#2f2680">MCP Server</text>
  <text x="845" y="424" text-anchor="middle" font-size="11" fill="#453aa8">container :8200</text>
  <text x="845" y="444" text-anchor="middle" font-size="11" fill="#453aa8">Expose les 5 tools + undo()</text>
  <text x="845" y="461" text-anchor="middle" font-size="11" fill="#453aa8">protocole MCP (HTTP)</text>
  <text x="845" y="478" text-anchor="middle" font-size="11" fill="#453aa8">Exécute les effets de bord</text>
  <text x="845" y="495" text-anchor="middle" font-size="11" fill="#453aa8">réels, sur demande du Backend</text>

  <!-- Ollama -->
  <rect x="520" y="560" width="200" height="110" rx="10" fill="#F2EFE6" stroke="#8A8578" stroke-width="2"/>
  <text x="620" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3630">Ollama</text>
  <text x="620" y="604" text-anchor="middle" font-size="11" fill="#5f594c">container :11434</text>
  <text x="620" y="622" text-anchor="middle" font-size="11" fill="#5f594c">Modèle Qwen3 (local)</text>
  <text x="620" y="640" text-anchor="middle" font-size="11" fill="#5f594c">inference + tool-calling</text>

  <!-- MailHog -->
  <rect x="990" y="420" width="200" height="100" rx="10" fill="#F2EFE6" stroke="#8A8578" stroke-width="2"/>
  <text x="1090" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3630">MailHog</text>
  <text x="1090" y="464" text-anchor="middle" font-size="11" fill="#5f594c">SMTP :1025 · UI :8025</text>
  <text x="1090" y="482" text-anchor="middle" font-size="11" fill="#5f594c">faux serveur mail /</text>
  <text x="1090" y="498" text-anchor="middle" font-size="11" fill="#5f594c">fausse boîte mail</text>

  <!-- Volume -->
  <rect x="990" y="530" width="200" height="100" rx="10" fill="#F2EFE6" stroke="#8A8578" stroke-width="2"/>
  <text x="1090" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3630">Volume Docker</text>
  <text x="1090" y="574" text-anchor="middle" font-size="11" fill="#5f594c">SQLite (fichier .db)</text>
  <text x="1090" y="592" text-anchor="middle" font-size="11" fill="#5f594c">PDF générés</text>
  <text x="1090" y="608" text-anchor="middle" font-size="11" fill="#5f594c">Fichiers .ics</text>

  <!-- External: GitHub -->
  <rect x="1270" y="350" width="260" height="140" rx="12" fill="#F7F5EF" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1400" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#55524a">GitHub Issues API</text>
  <text x="1400" y="398" text-anchor="middle" font-size="11.5" fill="#77746a">tracker réel (repo dédié)</text>
  <text x="1400" y="416" text-anchor="middle" font-size="11.5" fill="#77746a">auth par token personnel</text>
  <text x="1400" y="434" text-anchor="middle" font-size="11.5" fill="#77746a">seul service vraiment externe :</text>
  <text x="1400" y="452" text-anchor="middle" font-size="11.5" fill="#77746a">le LLM (Ollama) est désormais local</text>
  <text x="1400" y="470" text-anchor="middle" font-size="11.5" fill="#77746a">et tourne dans le docker-compose</text>

  <!-- Arrows -->
  <!-- Browser -> Frontend -->
  <line x1="300" y1="130" x2="300" y2="208" stroke="#4a463c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frontend <-> Backend -->
  <line x1="452" y1="260" x2="518" y2="260" stroke="#4a463c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="518" y1="285" x2="452" y2="285" stroke="#4a463c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="246" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2c2a24">HTTP/JSON</text>
  <text x="485" y="304" text-anchor="middle" font-size="9.5" fill="#5f594c">seul canal front↔back</text>

  <!-- Backend -> Agent AI -->
  <line x1="620" y1="342" x2="620" y2="378" stroke="#4a463c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="365" text-anchor="middle" font-size="10" fill="#5f594c">génération</text>

  <!-- Backend -> MCP server -->
  <line x1="845" y1="342" x2="845" y2="378" stroke="#4a463c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="915" y="365" text-anchor="middle" font-size="10" fill="#5f594c">exécution / undo</text>

  <!-- Agent AI -> MCP server (discovery, dotted) -->
  <line x1="722" y1="450" x2="743" y2="450" stroke="#6b6656" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowDotted)"/>
  <text x="732" y="438" text-anchor="middle" font-size="9" fill="#6b6656">list_tools()</text>

  <!-- Agent AI -> Ollama -->
  <line x1="620" y1="522" x2="620" y2="558" stroke="#4a463c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="545" text-anchor="middle" font-size="10" fill="#5f594c">tool-calling</text>

  <!-- MCP server -> MailHog -->
  <line x1="947" y1="465" x2="988" y2="465" stroke="#4a463c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="967" y="453" text-anchor="middle" font-size="9" fill="#5f594c">SMTP</text>

  <!-- MCP server -> Volume -->
  <line x1="947" y1="505" x2="988" y2="570" stroke="#4a463c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="985" y="518" text-anchor="middle" font-size="9" fill="#5f594c">fichiers/DB</text>

  <!-- MCP server -> GitHub (pass-through above storage column) -->
  <line x1="947" y1="395" x2="1268" y2="395" stroke="#8a8578" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <text x="1105" y="383" text-anchor="middle" font-size="10.5" fill="#5f594c">création / clôture d'issue</text>

  <!-- Note -->
  <text x="130" y="740" font-size="12.5" fill="#2c2a24">Note : le frontend n'accède jamais directement à la base de données ni aux fichiers générés — tout transite par l'API REST du backend.</text>
  <text x="130" y="760" font-size="12.5" fill="#2c2a24">Backend et MCP server partagent le même volume Docker (fichier SQLite unique) ; Agent AI n'a accès qu'au schéma des tools, jamais aux effets de bord.</text>

  <!-- Legend -->
  <rect x="130" y="800" width="18" height="18" rx="4" fill="#E7E4FB" stroke="#5B4FC7" stroke-width="2"/>
  <text x="156" y="814" font-size="12.5" fill="#2c2a24">Violet = cœur applicatif (Agent AI + MCP server / outils)</text>

  <rect x="560" y="800" width="18" height="18" rx="4" fill="#F2EFE6" stroke="#8A8578" stroke-width="2"/>
  <text x="586" y="814" font-size="12.5" fill="#2c2a24">Beige = interface, stockage, infra du compose (dont Ollama, désormais local)</text>

  <rect x="1080" y="800" width="18" height="18" rx="4" fill="#F7F5EF" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="1106" y="814" font-size="12.5" fill="#2c2a24">Pointillé large = service externe (hors docker-compose)</text>

  <text x="130" y="838" font-size="11.5" fill="#5f594c">Pointillé fin (entre Agent AI et MCP server) = appel de lecture seule (découverte du schéma des tools, aucun effet de bord).</text>
</svg>